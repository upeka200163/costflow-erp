# Render Blueprint Specification for CostFlow Manufacturing Cost Management ERP
# Deploy as a Free Web Service on Render with MongoDB Atlas support

services:
  - type: web
    name: costflow-erp
    env: node
    plan: free
    region: oregon # or frankfurt, ohio, singapore
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: "true"
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard
